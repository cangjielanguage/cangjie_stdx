# Compile-time default for the global contract check switch.
# "on" enables contract checking before the program starts; "off" keeps it disabled.
# cjc reads this file when compiling the package (an undefined custom condition is a
# compile error), and an explicit `--cfg "contract_check=off"` overrides it. The switch
# is baked into stdx.contract.runtime at build time: to turn the checks off, rebuild
# stdx.contract.runtime itself with `--cfg "contract_check=off"`.
contract_check = "on"
